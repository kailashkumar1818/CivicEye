services:
  db:
    image: postgis/postgis:16-3.4
    container_name: civiceye-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civiceye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civiceye_secret}
      POSTGRES_DB: ${POSTGRES_DB:-civiceye}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

