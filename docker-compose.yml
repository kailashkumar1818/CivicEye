services:
  db:
    image: postgis/postgis:16-3.4
    container_name: civiceye-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civiceye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civiceye_secret}
      POSTGRES_DB: ${POSTGRES_DB:-civiceye}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civiceye} -d ${POSTGRES_DB:-civiceye}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: civiceye-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-civiceye}:${POSTGRES_PASSWORD:-civiceye_secret}@db:5432/${POSTGRES_DB:-civiceye}
      DB_SSL: false
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-dev_ai_api_key_secret_12345}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-10000}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-CivicEye <no-reply@civiceye.local>}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: civiceye-ai
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-dev_ai_api_key_secret_12345}
      ALLOWED_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5000}
      MODEL_PATH: ${MODEL_PATH:-models/civiceye-yolov8n.pt}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.4}
      DEVICE: ${DEVICE:-cpu}
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service/models:/app/models:ro

volumes:
  pgdata: